:root{--ink:#101211;--paper:#eeeae0;--muted:#a5aaa3;--lime:#d5f36b;--line:rgba(255,255,255,.17);--pink:#ffa6c9;--stage-scale:1;--warm:#cebda0}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#090a09;color:var(--paper);font-family:Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button,a,input{-webkit-tap-highlight-color:transparent}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--lime);outline-offset:5px}button{color:inherit}a{color:inherit}img{display:block;max-width:100%}button{border:0;background:none}button:disabled{opacity:.28;cursor:default}button svg{pointer-events:none}::selection{background:var(--lime);color:var(--ink)}[hidden]{display:none!important}
#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden}#stage{width:1600px;height:900px;position:relative;flex:none;overflow:hidden;background:var(--ink);transform:scale(var(--stage-scale));transform-origin:center;box-shadow:0 0 180px #000}#screen{position:absolute;inset:0;overflow:hidden}#screen>.slide{animation:arrive .35s ease both}@keyframes arrive{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}.slide{position:absolute;inset:0;padding:108px 78px 90px}.slide.paper{background:var(--paper);color:var(--ink)}.slide.lime{background:var(--lime);color:var(--ink)}.slide.white{background:#f5f4f0;color:var(--ink)}.eyebrow,.mono{font-family:'Courier New',monospace;font-size:15px;line-height:1.5;letter-spacing:.08em}.eyebrow{text-transform:uppercase;margin:0 0 25px}.eyebrow.accent{color:var(--lime)}.paper .eyebrow.accent,.white .eyebrow.accent{color:#405128}h1,h2,h3,p{margin:0}h1,h2{letter-spacing:-.065em;line-height:.94;font-weight:800}h1{font-size:139px}h2{font-size:96px}h3{font-size:36px;letter-spacing:-.035em;line-height:1.1}.serif{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-style:italic;letter-spacing:-.055em}.outline{-webkit-text-stroke:1.2px currentColor;color:transparent}.accent{color:var(--lime)}.dim{color:var(--muted)}.body{font-size:25px;line-height:1.42;letter-spacing:-.018em}.caption{font:14px/1.5 'Courier New',monospace;letter-spacing:.015em}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid currentColor;border-radius:100px;padding:9px 15px;font:13px/1.15 'Courier New',monospace;text-transform:uppercase;letter-spacing:.08em}.pill.dot:before{content:'';height:6px;width:6px;background:currentColor;border-radius:50%}.action{display:inline-flex;align-items:center;gap:14px;background:var(--lime);color:var(--ink);padding:18px 25px;border:1px solid transparent;border-radius:2px;font-size:19px;font-weight:700;text-decoration:none;transition:transform .15s,background .15s}.action:hover{transform:translateY(-2px);background:#e6ff94}.action.ghost{border-color:var(--line);background:transparent;color:inherit}.paper .action.ghost,.white .action.ghost{border-color:#24242455}.action.small{padding:12px 18px;font-size:16px}.playicon{display:inline-block;width:0;height:0;border-top:7px solid transparent;border-bottom:7px solid transparent;border-left:11px solid currentColor}.actions{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.imagebutton{padding:0;position:relative;overflow:hidden;display:block;width:100%;text-align:left}.imagebutton:after{content:'↗';position:absolute;right:14px;top:12px;background:#121412aa;border:1px solid #ffffff44;color:#fff;width:33px;height:33px;display:grid;place-items:center;opacity:0;transition:opacity .2s}.imagebutton:hover:after{opacity:1}.imagebutton img{width:100%;height:100%;object-fit:cover;transition:transform .45s}.imagebutton:hover img{transform:scale(1.012)}

#stage,.slide,.slide.paper,.slide.white,.slide.lime{background:var(--ink);color:var(--paper)}
#screen>.slide{animation:arrive .24s ease both}
@keyframes arrive{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

const lifeThought=[
 'I’m in my apartment in Calder. Kitchen light on, studio light off. There’s a saucepan soaking in the sink and a jacket over the chair I keep telling people they can sit in.',
 'Sound gets my attention first. The refrigerator holds a low, uneven note. Outside, somebody drags a trash can over the sidewalk: two short bumps, one long scrape. My fingers answer on the counter before I bother looking out.',
 'Then movement. Headlights traveling across the ceiling. A curtain lifting against the window latch. One gold piece in my hair tapping the side of my sunglasses when I turn.',
 'I notice what needs doing almost automatically. The curtain still doesn’t close properly. There’s a cable coiled where somebody could catch a foot. I move the cable with my shoe. Leave the curtain.',
 'The mirror is in the hallway. Narrow. Slightly crooked.',
 'I stand in front of it.',
 'Long face, short beard, dark locs with gold caught in them. Black glasses. Yellow and black jacket hanging open over purple. The little speaker pendant has turned backward. I straighten it.',
 'Lift my chin.',
 'That’s a good angle. I hold it considerably longer than necessary.',
 '“Looking expensive, Malcolm.”',
 'Behind me, the kitchen light catches a receipt stuck under a mug.',
 '“Let’s keep the paperwork out of this.”',
 'I lean closer. There’s a little lint on my shoulder. I take it off, adjust the glasses, then catch myself preparing another expression.',
 'I let my mouth settle.',
 'For a moment, I’m just checking whether I like what I see.',
 'Mostly, yeah.',
 'I head back to the kitchen, move the jacket off the chair, and put water on. Somewhere outside, the trash can hits another crack. Terrible timing. I let it go.'
];

  $('#p-index').textContent=`PANTALLA ${s.slide+1} / ${C.slides.length} · ${s.content.chapter}${s.steps?` · PASO ${s.step+1} / ${s.steps+1}`:''}`;
