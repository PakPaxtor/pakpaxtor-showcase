name: Publicar PakPaxtor Showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener archivos
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configurar Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Preparar la web y descargar el vídeo 1080p
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p _site/assets
          cp index.html _site/index.html
          cp .nojekyll _site/.nojekyll
          cp -R assets/. _site/assets/
          SUMMER_TAG="$(python3 -c 'import json; print(json.load(open(".github/media/verano.json"))["release_tag"])')"
          SUMMER_ASSET="$(python3 -c 'import json; print(json.load(open(".github/media/verano.json"))["asset_name"])')"
          gh release download "$SUMMER_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$SUMMER_ASSET" --output _site/assets/verano.mp4 --clobber
          python3 .github/scripts/validate_site.py
      - name: Subir la web completa
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
